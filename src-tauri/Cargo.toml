[package]
name = "ape-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.4", features = ["default", "devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio-util = "0.7"
chrono = "0.4"
anyhow = "1"
thiserror = "1"
tauri-plugin-log = "2"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[lib]
name = "apetauri_lib"
path = "src/lib.rs"

[[bin]]
name = "ape-tauri"
path = "src/main.rs"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
